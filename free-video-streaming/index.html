<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- 主容器 -->
    <div class="app-container">
        <!-- 头部搜索区域 -->

                <input type="text" id="searchInput" class="search-input" placeholder="搜索视频...">

            </div>
        </header>
        
        <!-- 主内容区域 -->
        <main class="app-main">
            <!-- 搜索结果区域 -->
            <section id="searchResults" class="search-results">
                <!-- 搜索结果将在这里动态生成 -->
            </section>
            
            <!-- 视频播放区域 -->
            <section id="videoPlayer" class="video-player" style="display: none;">
                <!-- 视频播放器将在这里动态生成 -->
            </section>
            
            <!-- 视频详情区域 -->
            <section id="videoDetail" class="video-detail" style="display: none;">
                <!-- 视频详情将在这里动态生成 -->
            </section>
        </main>
        
        <!-- 底部区域 -->

            <div class="copyright">
                <p>&copy; 2026 免费视频流媒体 - 仅供学习使用</p>
            </div>
        </footer>
    </div>
    
    <!-- JavaScript文件 -->
    <!-- 工具函数 -->
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/models.js"></script>
    
    <!-- 核心模块 -->
    <script src="js/modules/cors.js"></script>
    <script src="js/modules/crawler.js"></script>
    <script src="js/modules/api.js"></script>
    <script src="js/modules/search.js"></script>
    <script src="js/modules/player.js"></script>
    <script src="js/modules/download.js"></script>
    <script src="js/modules/share.js"></script>
    
    <!-- 应用入口 -->

</body>
</html>
